# Bài 10: cụm 3 máy trong cùng VPC (IP nội bộ, không đổi khi tắt/bật máy).
# Điền IP nội bộ của 2 node sau khi tạo máy (EC2 -> Instances -> Private IPv4 address).
[all:vars]
ansible_python_interpreter=/usr/bin/python3
push_redis_host=172.31.0.164

[redis_servers]
rocky-ctl ansible_connection=local

[push_servers]
rocky-node1 ansible_host=172.31.0.58 ansible_user=rocky
rocky-node2 ansible_host=172.31.7.127 ansible_user=rocky
