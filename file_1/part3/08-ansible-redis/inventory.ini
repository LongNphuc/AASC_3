# Bài 8: triển khai Redis lên chính máy control node (localhost).
# Module dnf cần thư viện python3-dnf của hệ thống, nên trên máy đích dùng /usr/bin/python3 (3.9),
# còn bản thân Ansible chạy bằng Python 3.12 trong virtualenv /opt/ansible-core-2.21.
[redis_servers]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3
